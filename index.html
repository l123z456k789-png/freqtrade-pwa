<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#080b09" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="私人账本" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="Encrypted private ledger. Passphrase required." />
    <title>私人账本</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <style>
      :root {
        color-scheme: dark;
        --ink: #080b09;
        --gold: #d8b46a;
        --gold-hi: #f3dfae;
        --gold-lo: #8a6a32;
        --paper: #f1ead9;
        --mist: #9aa69c;
        --mist-2: #6f7c72;
        --line: rgba(216, 180, 106, 0.18);
        --serif: "Songti SC", "Noto Serif CJK SC", "STSong", "SimSun", Georgia, serif;
        --sans: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
        --mono: "SFMono-Regular", "Cascadia Mono", "Roboto Mono", Consolas, monospace;
      }
      * { box-sizing: border-box; }
      html { background: var(--ink); -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: calc(24px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));
        background:
          radial-gradient(90% 60% at 50% -10%, rgba(216, 180, 106, 0.14), transparent 62%),
          radial-gradient(70% 45% at 50% 110%, rgba(104, 201, 155, 0.05), transparent 65%),
          var(--ink);
        color: var(--paper);
        font-family: var(--sans);
        -webkit-font-smoothing: antialiased;
      }
      .gate {
        position: relative;
        width: 100%;
        max-width: 360px;
        padding: 30px 24px 22px;
        border: 1px solid var(--line);
        border-radius: 26px;
        background:
          linear-gradient(158deg, rgba(255, 255, 255, 0.03), transparent 46%),
          linear-gradient(160deg, #151d16, #0d130f);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05), 0 30px 80px rgba(0, 0, 0, 0.55);
        text-align: center;
      }
      .gate::before {
        content: "";
        position: absolute;
        inset: -1px;
        border-radius: inherit;
        pointer-events: none;
        background: radial-gradient(55% 30% at 50% 0%, rgba(216, 180, 106, 0.1), transparent 70%);
      }
      .lock {
        position: relative;
        width: 82px;
        height: 82px;
        margin: 0 auto 18px;
        color: var(--gold);
        filter: drop-shadow(0 0 22px rgba(216, 180, 106, 0.18));
      }
      .lock::before,
      .lock::after {
        content: "";
        position: absolute;
        inset: 0;
        border: 1px solid rgba(216, 180, 106, 0.16);
        border-radius: 50%;
      }
      .lock::before { inset: -10px; }
      .lock::after { inset: -20px; opacity: 0.5; }
      .lock svg { position: relative; width: 100%; height: 100%; }
      .eyebrow {
        margin: 0;
        color: var(--gold-lo);
        font-family: var(--mono);
        font-size: 9px;
        letter-spacing: 0.2em;
      }
      h1 {
        margin: 9px 0 7px;
        font-family: var(--serif);
        font-size: 27px;
        font-weight: 500;
        letter-spacing: 0.04em;
        color: var(--gold-hi);
      }
      .hint {
        margin: 0 auto;
        max-width: 280px;
        color: var(--mist);
        font-size: 11.5px;
        line-height: 1.7;
      }
      form { margin-top: 20px; text-align: left; }
      .field {
        display: block;
        margin-bottom: 10px;
      }
      .field span {
        display: block;
        margin: 0 0 6px 2px;
        color: var(--gold-lo);
        font-family: var(--mono);
        font-size: 9px;
        letter-spacing: 0.1em;
      }
      input[type="password"] {
        width: 100%;
        height: 50px;
        padding: 0 14px;
        border: 1px solid rgba(216, 180, 106, 0.18);
        border-radius: 13px;
        background: rgba(6, 10, 7, 0.72);
        color: var(--paper);
        font-family: var(--sans);
        font-size: 15px;
        outline: none;
      }
      input[type="password"]:focus {
        border-color: var(--gold);
        box-shadow: 0 0 0 3px rgba(216, 180, 106, 0.08);
      }
      .remember {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 4px 0 14px;
        color: var(--mist);
        font-size: 10.5px;
        cursor: pointer;
      }
      .remember input { width: 15px; height: 15px; accent-color: var(--gold); }
      .unlock-button {
        width: 100%;
        min-height: 48px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 13px;
        background: linear-gradient(180deg, #f5e2b2 0%, #dfb76e 38%, #c29445 100%);
        color: #211708;
        font-family: var(--sans);
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.06em;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.55), 0 10px 26px rgba(184, 137, 59, 0.16);
        cursor: pointer;
      }
      .unlock-button:active { transform: translateY(1px); }
      .unlock-button:disabled { opacity: 0.55; cursor: wait; }
      .status {
        min-height: 30px;
        margin: 12px 0 0;
        color: var(--mist-2);
        font-size: 10.5px;
        line-height: 1.6;
        text-align: center;
      }
      .status.is-error { color: #e0705f; }
      .status.is-ok { color: #68c99b; }
      .foot {
        margin: 12px 0 0;
        color: var(--mist-2);
        font-family: var(--mono);
        font-size: 8px;
        letter-spacing: 0.06em;
      }
      @media (prefers-reduced-motion: reduce) {
        * { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
      }
    </style>
  </head>
  <body>
    <main class="gate">
      <div class="lock" aria-hidden="true">
        <svg viewBox="0 0 64 64" fill="none">
          <circle cx="32" cy="32" r="29" stroke="currentColor" stroke-width="1.2" opacity="0.55" />
          <circle cx="32" cy="32" r="24" stroke="currentColor" stroke-width="0.7" opacity="0.3" />
          <rect x="19" y="29" width="26" height="20" rx="5" stroke="currentColor" stroke-width="1.8" />
          <path d="M24.5 29v-5.5a7.5 7.5 0 0 1 15 0V29" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
          <circle cx="32" cy="38" r="2.6" fill="currentColor" />
          <path d="M32 40.5V45" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        </svg>
      </div>
      <p class="eyebrow">PRIVATE LEDGER</p>
      <h1>输入口令解锁</h1>
      <p class="hint">这台设备只保存密文。口令在本地解密，不会上传，也不会写进仓库。</p>
      <form id="unlockForm" autocomplete="off">
        <label class="field" for="passphrase">
          <span>解密口令</span>
          <input id="passphrase" type="password" autocomplete="current-password" placeholder="输入同步口令" required />
        </label>
        <label class="remember" for="remember">
          <input id="remember" type="checkbox" checked />
          <span>在本机记住，下次自动解锁</span>
        </label>
        <button class="unlock-button" id="unlockButton" type="submit">解锁账本</button>
      </form>
      <p class="status" id="status" role="status"></p>
      <p class="foot">AES-256-GCM · PBKDF2 · 100,000 次</p>
    </main>
    <script src="./unlock.js" defer></script>
  </body>
</html>
